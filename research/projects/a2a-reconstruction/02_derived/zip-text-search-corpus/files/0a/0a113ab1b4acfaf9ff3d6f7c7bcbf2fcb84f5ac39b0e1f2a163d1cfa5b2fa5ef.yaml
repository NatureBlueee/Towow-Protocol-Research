artifacts:
- id: RunManifest
  purpose: 一次运行的目标、非目标、concern、风险、产物和成功条件。
- id: ConsumerSession
  purpose: 消费者、版本、已加载节点、冲突和输出契约。
- id: CapabilityPlan
  purpose: concern 到 Producer/Reviewer/Decision Owner 的映射。
- id: ContextLoadRecord
  purpose: 装载的包、版本、理由、冲突和依赖结论。
- id: EvidenceItem
  purpose: 来源、范围、可信度和支持的主张。
- id: DecisionRecord
  purpose: 选择、依据、替代方案、后果和影响范围。
- id: ObjectCard
  purpose: 领域对象身份、属性、关系、生命周期与不变量。
- id: ClosedLoopCard
  purpose: 动机到结果、失败、恢复、责任和沉淀。
- id: ViewCard
  purpose: 角色任务下的受控产品投影。
- id: RiskRecord
  purpose: 风险、暴露、控制、残余风险和升级。
- id: ClaimRecord
  purpose: 对外主张、依据、状态、限定与禁止扩展。
- id: ChangeSet
  purpose: 变更原因、受影响节点、迁移与回归结果。
- id: EscalationCase
  purpose: 需人类或高权限处理的精确问题包。
- id: ValidationReport
  purpose: 质量门结果和修复建议。
- id: RunReport
  purpose: 路由、上下文、产物、校验、升级、指标和方法反馈。
