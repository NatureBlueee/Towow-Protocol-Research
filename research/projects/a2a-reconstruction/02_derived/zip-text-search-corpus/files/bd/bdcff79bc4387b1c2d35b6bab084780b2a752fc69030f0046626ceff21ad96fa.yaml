major_findings:
  - id: R54-DEFECT-001
    summary: >-
      git worktree creation emitted a false main-branch drift alarm and wrote
      harness/.towow/git-discipline-violations.log, while readback confirmed
      the main worktree remained on main at the same commit.
    class: repo_specific_defect
  - id: R54-DEFECT-002
    summary: >-
      The current @reference lifecycle collapses independent owners at
      locator-only seams unless source identity is propagated through producer,
      ordered fold, projection, auxiliary events, and retire evidence.
    class: repo_specific_defect
  - id: R54-MECH-001
    summary: >-
      Direct A2A exposed and refined a real conflict between historical
      wildcard compatibility and sourced-owner isolation, and formed recovery
      governance clauses, but did not produce a signed or adopted condition.
    class: mechanism_evidence
  - id: R54-MECH-002
    summary: >-
      Static analysis found the main composite-identity defect, and fixed
      central owner queries exposed the same legacy conflict. The observed A2A
      increment was specification precision, not a uniquely reachable solution.
    class: mechanism_evidence
  - id: R54-PRINCIPLE-001
    summary: >-
      Functional no-tool context separation can support a local benign A2A
      experiment, but does not establish OS isolation, sovereignty, or
      non-collapsible authority.
    class: transferable_design_principle
  - id: R54-RUNTIME-001
    summary: >-
      The frozen long structured-output central builder closed mid-response in
      two separately preregistered runs. Central synthesis remains Unknown;
      transport failure is not a reasoning failure.
    class: repo_specific_defect
