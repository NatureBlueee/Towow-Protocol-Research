forbidden_interpretations:
- id: not_freelance_market
  statement: 召集台不是按价格和职业标签撮合劳动力的自由职业市场。
- id: not_project_manager
  statement: 召集台不是把里程碑、文件和评论放在一起的普通项目管理工具。
- id: not_ai_chat_shell
  statement: 召集台不是以大输入框和常驻 AI 助手为中心的 AI 外壳。
- id: not_dashboard_only
  statement: 运营驾驶舱是事实的解释视图，不是产品本体，也不得脱离对象下钻。
- id: not_one_state_machine
  statement: 宏观协作阶段不能代替 Intent、Summon、Grant、Verification、Acceptance 等对象各自的生命周期。
- id: not_reputation_bearing
  statement: 声誉可作为信号，但不能替代证据、授权、验证与责任。
